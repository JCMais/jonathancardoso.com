[build]
  base    = "."
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "26"

# Language-based redirects for the unprefixed root and legacy paths.
# Netlify evaluates rules in order; the Language-conditioned rule wins for pt browsers.
[[redirects]]
  from = "/"
  to = "/pt-br/"
  status = 302
  force = true
  conditions = { Language = ["pt"] }

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = true

[[redirects]]
  from = "/blog/*"
  to = "/pt-br/blog/:splat"
  status = 302
  conditions = { Language = ["pt"] }

[[redirects]]
  from = "/blog/*"
  to = "/en/blog/:splat"
  status = 302

[[redirects]]
  from = "/privacy/"
  to = "/en/privacy/"
  status = 302

[[redirects]]
  from = "/pt-br/*"
  to = "/pt-br/404/"
  status = 404

[[redirects]]
  from = "/en/*"
  to = "/en/404/"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
